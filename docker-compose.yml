services:
  tp-link-api-bridge:
    # Published by this repository's own workflow. Swap for `build: .` to run
    # your own working copy instead.
    image: ghcr.io/kristofer84/tp-link-modem-router:latest
    container_name: tp-link-api-bridge
    restart: unless-stopped
    init: true
    # Configuration comes from the environment -- see .env.example. A
    # config.json still works if you prefer it:
    #   volumes:
    #     - ./config.json:/app/config.json:ro
    env_file: .env
    ports:
      - "3000:3000"
